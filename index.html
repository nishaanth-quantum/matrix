<style>
:root{
  --bg:#f4f3ef;--surface:#fff;--surface2:#f9f8f5;
  --border:#e2e0d8;--border2:#ccc9be;
  --text:#1a1916;--text2:#6b6860;--text3:#9b9890;
  --l1-bg:#e8f0fe;--l1-text:#1a56b0;--l1-border:#b0c8f8;
  --l2-bg:#fff3cd;--l2-text:#8a5c00;--l2-border:#f0d080;
  --l3-bg:#fde8e8;--l3-text:#a82020;--l3-border:#f4b0b0;
  --accent:#1a56b0;--danger:#dc2626;
  --radius:10px;--radius-sm:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.site-header{background:var(--surface);border-bottom:1.5px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50;}
.logo-block{display:flex;align-items:center;gap:12px;}
.logo-img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.company-name{font-size:15px;font-weight:600;letter-spacing:.03em;color:var(--text);}
.company-sub{font-size:11px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.matrix-select{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;padding:8px 32px 8px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background-color:var(--surface2);color:var(--text);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b6860' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;transition:border-color .15s;white-space:nowrap;}
.matrix-select:focus{border-color:var(--accent);}
.matrix-select:hover{border-color:var(--accent);}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
.search-input{font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 12px 8px 34px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);width:200px;outline:none;transition:border-color .15s,box-shadow .15s;}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,176,.1);}
.btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:7px 15px;border-radius:var(--radius-sm);border:1.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:#1648a0;}
.btn-secondary{background:var(--surface);color:var(--text2);border-color:var(--border2);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:#fef2f2;color:var(--danger);border-color:#fecaca;}
.btn-danger:hover{background:#fee2e2;}
.btn-sm{font-size:11px;padding:4px 9px;}
.btn-admin{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.btn-admin:hover{border-color:var(--accent);color:var(--accent);}
.btn-admin.logout{border-color:#fecaca;color:var(--danger);background:#fef2f2;}
.btn-admin.logout:hover{background:#fee2e2;}
.filter-bar{display:none;gap:8px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
.filter-bar.show{display:flex;}
.filter-label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
.filter-select{font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 28px 5px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b6860' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;transition:border-color .15s;}
.filter-select:focus{border-color:var(--accent);}
.filter-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--l1-bg);color:var(--l1-text);border:1px solid var(--l1-border);font-weight:500;}
.filter-chip button{background:none;border:none;cursor:pointer;color:var(--l1-text);font-size:14px;line-height:1;padding:0;}
.filter-clear{font-size:11px;color:var(--text3);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;padding:4px 8px;border-radius:var(--radius-sm);}
.filter-clear:hover{color:var(--danger);}
.main{padding:0;}
.table-card{background:var(--surface);border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border);}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead tr{background:#f0ede5;border-bottom:1.5px solid var(--border);}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);white-space:nowrap;}
th.actions-th{width:115px;text-align:center;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#fafaf7;}
td{padding:11px 14px;font-size:13px;vertical-align:top;}
td.group-cell{font-weight:600;font-size:13px;color:var(--text);background:#f7f6f2;border-right:2px solid var(--border);}
.dept-cell{font-weight:500;font-size:13px;color:var(--text);line-height:1.4;}
.client-cell{font-weight:600;font-size:13px;color:var(--text);}
.esc-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;margin-bottom:4px;letter-spacing:.04em;}
.l1-badge{background:var(--l1-bg);color:var(--l1-text);border:1px solid var(--l1-border);}
.l2-badge{background:var(--l2-bg);color:var(--l2-text);border:1px solid var(--l2-border);}
.l3-badge{background:var(--l3-bg);color:var(--l3-text);border:1px solid var(--l3-border);}
.role-pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.03em;}
.role-pill.admin{background:var(--l3-bg);color:var(--l3-text);border:1px solid var(--l3-border);}
.role-pill.editor{background:var(--l1-bg);color:var(--l1-text);border:1px solid var(--l1-border);}
.form-group select{font-family:'DM Sans',sans-serif;font-size:13px;width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;cursor:pointer;transition:border-color .15s;}
.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,176,.1);}
.checkbox-group{display:flex;flex-direction:column;gap:9px;margin-top:3px;}
.form-group .checkbox-item{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:var(--text);cursor:pointer;margin-bottom:0;text-transform:none;letter-spacing:normal;}
.checkbox-item input[type="checkbox"]{width:16px;height:16px;flex-shrink:0;margin:0;padding:0;cursor:pointer;accent-color:var(--accent);}
.users-table-wrap table{width:100%;}
.users-table-wrap td,.users-table-wrap th{padding:9px 10px;}
.no-users-msg{text-align:center;padding:24px;color:var(--text3);font-size:13px;}
.contact-name{font-weight:500;font-size:13px;color:var(--text);margin-bottom:2px;}
.contact-phone,.contact-email{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:4px;margin-top:2px;flex-wrap:wrap;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:4px;cursor:pointer;text-decoration:none;flex-shrink:0;transition:all .15s;}
.icon-call{border:1.3px solid #1a56b0;background:#e8f0fe;color:#1a56b0;}
.icon-call:hover{background:#1a56b0;color:#fff;}
.icon-wa{border:1.3px solid #25d366;background:#e6faf0;color:#128c3e;}
.icon-wa:hover{background:#25d366;color:#fff;}
.contact-email a{color:var(--accent);text-decoration:none;word-break:break-all;}
.contact-email a:hover{text-decoration:underline;}
.empty-contact{color:var(--text3);font-size:12px;font-style:italic;}
.row-actions{display:flex;gap:4px;justify-content:center;}
.no-results{text-align:center;padding:48px 20px;color:var(--text3);font-size:14px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(20,18,14,.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
.overlay.open{display:flex;}
#confirmOverlay.open{z-index:300;}
.modal{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);width:100%;max-width:660px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18);animation:slideUp .2s ease;}
.login-modal{max-width:380px;}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:18px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:20px;line-height:1;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px 24px;}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11.5px;font-weight:500;color:var(--text2);margin-bottom:5px;}
.form-group input{font-family:'DM Sans',sans-serif;font-size:13px;width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s;}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,176,.1);}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px;}
.esc-section{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;background:var(--surface2);}
.esc-section-hd{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;}
.esc-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.login-body{padding:28px 28px 20px;text-align:center;}
.login-logo{width:56px;height:56px;border-radius:12px;object-fit:cover;margin:0 auto 16px;display:block;}
.login-body h3{font-size:17px;font-weight:600;margin-bottom:6px;}
.login-body p{font-size:13px;color:var(--text2);margin-bottom:20px;}
.login-body input{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;text-align:center;letter-spacing:.06em;margin-bottom:8px;transition:border-color .15s;}
.login-body input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,176,.1);}
.login-error{font-size:12px;color:var(--danger);min-height:18px;margin-bottom:8px;}
.btn-login{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;}
.btn-login:hover{background:#1648a0;}
.login-cancel{margin-top:10px;font-size:12px;color:var(--text3);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;}
.login-cancel:hover{color:var(--text2);}
.confirm-card{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:28px 28px 20px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .15s ease;}
.confirm-card h4{font-size:15px;font-weight:600;margin-bottom:8px;}
.confirm-card p{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.confirm-actions{display:flex;gap:10px;justify-content:center;}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1916;color:#fff;font-size:13px;font-weight:500;padding:10px 18px;border-radius:var(--radius-sm);z-index:999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
@media(max-width:640px){.search-input{width:140px;}.esc-fields{grid-template-columns:1fr;}.form-row{grid-template-columns:1fr;}.matrix-select{padding:6px 26px 6px 10px;font-size:11px;}}
.import-overlay{display:none;position:fixed;inset:0;background:rgba(20,18,14,.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
.import-overlay.open{display:flex;}
.import-modal{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18);animation:slideUp .2s ease;}
.import-drop{border:2px dashed var(--border2);border-radius:var(--radius-sm);padding:36px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface2);margin-bottom:14px;}
.import-drop:hover,.import-drop.dragover{border-color:var(--accent);background:#f0f4ff;}
.import-drop svg{display:block;margin:0 auto 10px;color:var(--text3);}
.import-drop p{font-size:13px;color:var(--text2);margin:0;}
.import-drop .hint{font-size:11px;color:var(--text3);margin-top:6px;}
.import-preview{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;font-size:12px;}
.import-preview h4{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase;}
.import-stats{display:flex;gap:12px;flex-wrap:wrap;}
.import-stat{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);}
.import-stat strong{color:var(--text);font-weight:600;}
.import-warning{background:#fffbeb;border:1px solid #f0d080;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:#8a5c00;margin-bottom:12px;}
.import-error{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--danger);margin-bottom:12px;}
.import-mode-row{display:flex;gap:8px;margin-bottom:14px;}
.import-mode-btn{flex:1;padding:8px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);background:var(--surface2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;}
.import-mode-btn.active{border-color:var(--accent);background:var(--l1-bg);color:var(--l1-text);}
.import-template-link{font-size:11.5px;color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:'DM Sans',sans-serif;padding:0;}
.import-template-link:hover{color:#1648a0;}
.spoc-list{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0;}
.spoc-card{display:flex;align-items:flex-start;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px;min-width:200px;max-width:300px;}
.spoc-num{display:flex;align-items:center;justify-content:center;min-width:22px;height:22px;background:var(--accent);color:#fff;border-radius:50%;font-size:11px;font-weight:700;margin-top:1px;flex-shrink:0;}
.spoc-info{display:flex;flex-direction:column;gap:2px;}
</style>

      <p>Enter your username and password to enable editing.</p>

      <input type="password" id="pwInput" placeholder="Password"/>

<div class="overlay" id="usersOverlay">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <div class="modal-title">User &amp; Role Access</div>
      <button class="modal-close" id="usersCloseBtn">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div id="usersListView">
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
          <button class="btn btn-primary btn-sm" id="addUserBtn">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Add User
          </button>
        </div>
        <div class="users-table-wrap" id="usersTableWrap"></div>
      </div>
      <div id="usersFormView" style="display:none">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="ufUsername" placeholder="e.g. esc_editor1"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="text" id="ufPassword" placeholder="Password"/>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="ufRole">
            <option value="admin">Admin (full access)</option>
            <option value="editor">Editor (selected matrices)</option>
          </select>
        </div>
        <div class="form-group" id="ufCatGroup">
          <label>Matrix Categories</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" id="ufCatEsc" value="escalation"/> Escalation Matrix</label>
            <label class="checkbox-item"><input type="checkbox" id="ufCatRec" value="recruitment"/> Recruitment Matrix</label>
            <label class="checkbox-item"><input type="checkbox" id="ufCatDoc" value="documents"/> Documents SPOC</label>
          </div>
        </div>
        <div class="login-error" id="userFormError" style="text-align:left;"></div>
      </div>
    </div>
    <div class="modal-footer" id="usersFormFooter" style="display:none">
      <button class="btn btn-secondary" id="userFormCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="userFormSaveBtn">Save User</button>
    </div>
  </div>
</div>
<div class="import-overlay" id="importOverlay">
  <div class="import-modal modal">
    <div class="modal-header">
      <div class="modal-title" id="importModalTitle">Import Data</div>
      <button class="modal-close" id="importCloseBtn">&#x2715;</button>
    </div>

  usersData.forEach(function(u){if(u.u.toLowerCase()===uname.toLowerCase()&&u.p===pw)match=u;});
  if(!match){
    document.getElementById('loginError').textContent='Incorrect username or password.';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
    return;
  }
  isAdmin=match.role==='admin';

  editorCats=isEditor?(match.cats||[]):[];
  currentUser=match.u;
  saveSession({role:match.role,cats:editorCats,user:match.u});

  var uname=(document.getElementById('ufUsername').value||'').trim();
  var pw=(document.getElementById('ufPassword').value||'').trim();
  var role=document.getElementById('ufRole').value;
  var cats=getCheckedCats();

  if(!uname){err.textContent='Username is required.';return;}
  if(!pw){err.textContent='Password is required.';return;}
  if(role==='editor'&&!cats.length){err.textContent='Select at least one matrix category.';return;}
  var dup=usersData.some(function(u,i){return i!==userFormIdx&&u.u.toLowerCase()===uname.toLowerCase();});
  if(dup){err.textContent='That username is already taken.';return;}
  var rec={u:uname,p:pw,role:role,cats:role==='editor'?cats:null};
  if(userFormIdx>=0)usersData[userFormIdx]=rec;else usersData.push(rec);
  save(USERS_KEY,usersData);

    document.getElementById('importModeRec').style.display=editorCats.indexOf('recruitment')>-1?'':'none';
    document.getElementById('importModeDoc').style.display=editorCats.indexOf('documents')>-1?'':'none';
  }
  setImportMode(startMode);
  document.getElementById('importOverlay').classList.add('open');
}
function closeImport(){document.getElementById('importOverlay').classList.remove('open');importParsedRows=null;}
function resetImportPreview(){
  document.getElementById('importPreviewArea').style.display='none';
  document.getElementById('importPreviewArea').innerHTML='';
  document.getElementById('importDropZone').style.display='';
  document.getElementById('importConfirmBtn').disabled=true;
  importParsedRows=null;
}
function parseImportFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=e.target.result;
      var wb;
      if(file.name.endsWith('.csv')){
        wb=XLSX.read(data,{type:'binary'});
      } else {
        wb=XLSX.read(new Uint8Array(data),{type:'array'});
      }
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      processImportRows(rows,file.name);
    } catch(err){
      showImportError('Could not parse file: '+err.message);
    }
  };
  if(file.name.endsWith('.csv')){
    reader.readAsBinaryString(file);
  } else {
    reader.readAsArrayBuffer(file);
  }
}
function processImportRows(rows,fname){
  if(!rows||rows.length<2){showImportError('File appears empty or has no data rows.');return;}
  // Skip header row
  var dataRows=rows.slice(1).filter(function(r){return r.some(function(c){return (c+'').trim()!=='';});});
  if(!dataRows.length){showImportError('No data rows found after the header.');return;}
  var parsed=[];
  var errors=[];
  dataRows.forEach(function(r,idx){
    var rowNum=idx+2;
    if(importMode==='escalation'){
      var dept=(r[0]+'').trim();
      if(!dept){errors.push('Row '+rowNum+': Department is required');return;}
      parsed.push({dept:dept,e:[
        {n:(r[1]+'').trim(),p:(r[2]+'').trim(),em:(r[3]+'').trim()},
        {n:(r[4]+'').trim(),p:(r[5]+'').trim(),em:(r[6]+'').trim()},
        {n:(r[7]+'').trim(),p:(r[8]+'').trim(),em:(r[9]+'').trim()}
      ]});
    } else if(importMode==='documents'){
      var dept=(r[2]+'').trim()||((r[0]+'').trim());
      if(!dept){errors.push('Row '+rowNum+': Client is required');return;}
      var spocs=[];
      for(var si=3;si+1<r.length;si+=2){
        var sn=(r[si]+'').trim(),sp=(r[si+1]+'').trim();
        if(sn||sp)spocs.push({n:sn,p:sp,em:''});
      }
      parsed.push({state:(r[0]+'').trim(),location:(r[1]+'').trim(),client:(r[2]+'').trim(),spocs:spocs});
    } else {
      var state=(r[0]+'').trim(),city=(r[1]+'').trim(),client=(r[2]+'').trim();
      if(!state&&!client){errors.push('Row '+rowNum+': State or Client is required');return;}
      parsed.push({state:state,city:city,client:client,e:[
        {n:(r[3]+'').trim(),p:(r[4]+'').trim(),em:(r[5]+'').trim()},
        {n:(r[6]+'').trim(),p:(r[7]+'').trim(),em:(r[8]+'').trim()},
        {n:(r[9]+'').trim(),p:(r[10]+'').trim(),em:(r[11]+'').trim()}
      ]});
    }
  });
  importParsedRows=parsed;
  showImportPreview(fname,parsed,errors,dataRows.length);
}
function showImportError(msg){
  var area=document.getElementById('importPreviewArea');
  area.innerHTML='<div class="import-error"><strong>Error:</strong> '+h(msg)+'</div>';
  area.style.display='';
  document.getElementById('importDropZone').style.display='';
  document.getElementById('importConfirmBtn').disabled=true;
}
function showImportPreview(fname,parsed,errors,total){
  var area=document.getElementById('importPreviewArea');
  var html='<div class="import-preview"><h4>Preview — '+h(fname)+'</h4><div class="import-stats">';
  html+='<div class="import-stat">Total rows found: <strong>'+total+'</strong></div>';
  html+='<div class="import-stat">Valid rows: <strong>'+parsed.length+'</strong></div>';
  if(errors.length)html+='<div class="import-stat" style="color:var(--danger)">Skipped: <strong>'+errors.length+'</strong></div>';
  html+='</div></div>';
  if(errors.length){
    html+='<div class="import-warning"><strong>'+errors.length+' row(s) skipped:</strong><br>'+errors.slice(0,5).map(function(e){return h(e);}).join('<br>')+(errors.length>5?'<br>…and '+(errors.length-5)+' more':'')+'</div>';
  }
  if(!parsed.length){
    html+='<div class="import-error">No valid rows to import.</div>';
    document.getElementById('importConfirmBtn').disabled=true;
  } else {
    html+='<div style="font-size:12px;color:var(--text2);margin-bottom:4px;">Choose import mode:</div>';
    html+='<div class="import-mode-row" style="margin-bottom:0">';
    html+='<button class="import-mode-btn active" id="appendModeBtn" onclick="setMergeMode(\'append\')">Append to existing</button>';
    html+='<button class="import-mode-btn" id="replaceModeBtn" onclick="setMergeMode(\'replace\')">Replace all data</button>';
    html+='</div>';
    document.getElementById('importConfirmBtn').disabled=false;
  }
  area.innerHTML=html;
  area.style.display='';
  document.getElementById('importDropZone').style.display='none';
  window._importMergeMode='append';
}
function setMergeMode(m){
  window._importMergeMode=m;
  document.getElementById('appendModeBtn').className='import-mode-btn'+(m==='append'?' active':'');
  document.getElementById('replaceModeBtn').className='import-mode-btn'+(m==='replace'?' active':'');
}
function doImport(){
  if(!importParsedRows||!importParsedRows.length)return;
  var key=importMode==='escalation'?ESC_KEY:importMode==='recruitment'?REC_KEY:DOC_KEY;
  var existing=importMode==='escalation'?escData:importMode==='recruitment'?recData:docData;
  var newData=window._importMergeMode==='replace'?importParsedRows:existing.concat(importParsedRows);
  if(importMode==='escalation')escData=newData;else if(importMode==='recruitment')recData=newData;else docData=newData;
  save(key,newData);
  closeImport();
  if(importMode!==mode)switchMatrix(importMode);
  else{renderFilters();renderTable();}
  toast('Imported '+importParsedRows.length+' rows successfully');
}
